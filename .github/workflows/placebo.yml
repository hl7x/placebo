name: placebo

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build_and_test:

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...